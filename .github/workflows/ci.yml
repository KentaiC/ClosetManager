name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-app:
    name: iOS app build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build ClosetManager for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project ClosetManager.xcodeproj \
            -target ClosetManager \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -200

  swift-package-linux:
    name: Swift package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Run swift test
        run: swift test

  swift-package-macos:
    name: Swift package tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Run swift test
        run: swift test

  web:
    name: Web UI (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (server + Chromium)
    runs-on: ubuntu-latest
    needs: [web, swift-package-linux]
    timeout-minutes: 40
    env:
      SWIFT_IMAGE: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Build web UI and install Chromium
        working-directory: Web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Build closet-server in the Swift image
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$SWIFT_IMAGE" bash -c \
            "apt-get update -q && apt-get install -y -q libsqlite3-dev && swift build --product closet-server"
      - name: Run Playwright
        working-directory: Web
        run: |
          # 服务端以 0700 权限创建数据目录 Web/e2e/.data。容器以运行器的用户身份运行服务端，
          # 这样该目录归运行器所有，Playwright 扫描 e2e 目录时才能读取它。
          export CLOSET_SERVER_BIN="docker run --rm --init --network host --user $(id -u):$(id -g) -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE -w $GITHUB_WORKSPACE $SWIFT_IMAGE $GITHUB_WORKSPACE/.build/debug/closet-server"
          npx playwright test
      - name: Stop server containers
        if: always()
        run: docker ps -q --filter "ancestor=$SWIFT_IMAGE" | xargs -r docker rm -f
